<!DOCTYPE html>
<html lang="pt_br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Movies Circle</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="./js/main.js"></script>
</head>
<body>
  <section class="p-4">
    <div class="mb-4">
      <h1 class="mb-2 text-3xl font-bold text-blue-600">Filmes assistidos</h1>
      <p class="text-gray-600">Boa noite, confira abaixo os filmes que vocês já assistiram:</p>
    </div>

    <form class="relative">
      <input type="search" class="w-full p-3 text-gray-600 rounded-lg border border-gray-200" placeholder="Procure por um filme">
      <button class="absolute right-1 top-1 cursor-pointer p-2 rounded-lg text-white bg-blue-600 hover:bg-blue-700 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
        </svg>
      </button>
    </form>
  </section>

  <section class="p-4">
    <div class="flex flex-wrap gap-3">
      <div class="w-32 h-48 rounded-lg bg-gray-300"></div>
      <div class="w-32 h-48 rounded-lg bg-gray-300"></div>
      <div class="w-32 h-48 rounded-lg bg-gray-300"></div>
    </div>
  </section>
</body>
</html>
