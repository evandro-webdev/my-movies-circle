<!DOCTYPE html>
<html lang="pt_br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Movies Circle</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="./js/app.js" type="module"></script>
  <script src="./js/main.js" type="module"></script>
</head>
<body>
  <main class="max-w-7xl mx-auto">
    <section class="p-4 lg:py-14">
      <div class="mb-4">
        <h1 class="mb-2 text-3xl font-bold text-blue-600">Filmes assistidos</h1>
        <p class="text-gray-600">Boa noite, confira abaixo os filmes que vocês já assistiram:</p>
      </div>
  
      <form id="search-form" class="relative">
        <input id="search-input" value="vingança" type="search" class="w-full p-3 text-gray-600 rounded-lg border border-gray-200" placeholder="Procure por um filme">
        <button type="submit" class="absolute right-1 top-1 cursor-pointer p-2 rounded-lg text-white bg-blue-600 hover:bg-blue-700 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
            <path stroke-linecap="round" stroke-linejoin="round" d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z" />
          </svg>
        </button>
      </form>
    </section>
  
    <section class="p-4">
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-2" id="movies-list"></div>
    </section>
  </main>
</body>
</html>
