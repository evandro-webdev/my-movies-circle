<!DOCTYPE html>
<html lang="pt_br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="manifest" href="/manifest.json">
    <link rel="icon" type="image/png" href="/img/icons/favicon.ico" />

    <link rel="apple-touch-icon" href="/img/icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CineTrack">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unicons.iconscout.com/release/v4.2.0/css/line.css"
    />

    <script src="./js/app.js" type="module"></script>
    <script src="./js/main.js" type="module"></script>
    <style>
      html {
        font-family: "DM Sans", "Inter", sans-serif;
      }
    </style>
    
    <title>CineTrack</title>
  </head>
  <body>
    <div id="splash-screen" class="fixed z-[9999] inset-0 bg-[#0088FF] transition-opacity duration-700 flex justify-center items-center">
      <img src="./img/logo.png" class="w-[240px] animate-pulse" alt="logo do app">
    </div>

    <header class="p-4">
      <nav class="flex justify-between items-center">
        <button class="text-[#0088FF]">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
            class="lucide lucide-menu-icon lucide-menu"
          >
            <path d="M4 5h16" />
            <path d="M4 12h16" />
            <path d="M4 19h16" />
          </svg>
        </button>
        <div class="space-x-3">
          <button class="text-[#0088FF]">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-sun-icon lucide-sun"
            >
              <circle cx="12" cy="12" r="4" />
              <path d="M12 2v2" />
              <path d="M12 20v2" />
              <path d="m4.93 4.93 1.41 1.41" />
              <path d="m17.66 17.66 1.41 1.41" />
              <path d="M2 12h2" />
              <path d="M20 12h2" />
              <path d="m6.34 17.66-1.41 1.41" />
              <path d="m19.07 4.93-1.41 1.41" />
            </svg>
          </button>
          <button class="text-[#0088FF]">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="lucide lucide-bell-icon lucide-bell"
            >
              <path d="M10.268 21a2 2 0 0 0 3.464 0" />
              <path
                d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"
              />
            </svg>
          </button>
        </div>
      </nav>
    </header>

    <main class="max-w-7xl mx-auto">
      <div class="py-2 px-4 lg:py-14 mb-2 space-y-3">
        <form id="search-form" class="relative">
          <input
            id="search-input"
            type="search"
            class="w-full p-4 pr-12 rounded-2xl text-sm text-gray-700 bg-gray-100 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all"
            placeholder="Que filme você está procurando?"
          />
          <button
            type="submit"
            class="absolute right-1 top-1/2 -translate-y-1/2 p-2 rounded-xl text-white bg-gradient-to-t from-[#194476] to-[#215DA2] transition-all"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-6"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.607 10.607Z"
              />
            </svg>
          </button>
        </form>

        <div class="flex justify-between">
          <div class="flex items-center gap-1">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              class="w-4 h-4 text-blue-900/70"
            >
              <path d="M10 8h4" />
              <path d="M12 21v-9" />
              <path d="M12 8V3" />
              <path d="M17 16h4" />
              <path d="M19 12V3" />
              <path d="M19 21v-5" />
              <path d="M3 14h4" />
              <path d="M5 10V3" />
              <path d="M5 21v-7" />
            </svg>

            <span class="block text-xs text-gray-700">Ordernar por: Ano</span>
          </div>

          <span class="block text-xs text-gray-600">20 resultados</span>
        </div>
      </div>

      <div class="py-2 px-4">
        <section
          class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-x-2 gap-y-4"
          id="watched-movies"
        ></section>

        <section
          class="space-y-2"
          id="discover"
        ></section>

        <section
          class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-x-2 gap-y-4"
          id="saved"
        ></section>
      </div>
      <section class="py-2 px-4">
      </section>
    </main>

    <footer class="w-full px-4 py-10 text-center">Footer</footer>

    <nav
      class="fixed bottom-4 p-1 inset-x-4 rounded-lg border border-gray-200 bg-white shadow-sm flex gap-2"
    >
      <button
        class="py-[10px] px-[5px] text-[#0088FF] flex flex-1 justify-center items-center gap-2"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="w-4 h-4"
        >
          <path
            fill-rule="evenodd"
            d="M7.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM3.751 20.105a8.25 8.25 0 0 1 16.498 0 .75.75 0 0 1-.437.695A18.683 18.683 0 0 1 12 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 0 1-.437-.695Z"
            clip-rule="evenodd"
          />
        </svg>

        <span class="text-sm font-medium text-nowrap">Meus filmes</span>
      </button>

      <button
        class="py-[10px] px-[5px] text-gray-400 flex flex-1 justify-center items-center gap-2"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.75"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="w-4 h-4"
        >
          <path
            d="m16.24 7.76-1.804 5.411a2 2 0 0 1-1.265 1.265L7.76 16.24l1.804-5.411a2 2 0 0 1 1.265-1.265z"
          />
          <circle cx="12" cy="12" r="10" />
        </svg>

        <span class="text-sm font-medium text-nowrap">Descobrir</span>
      </button>

      <button
        class="py-[10px] px-[5px] text-gray-400 flex flex-1 justify-center items-center gap-2"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="currentColor"
          class="w-4 h-4"
        >
          <path
            fill-rule="evenodd"
            d="M6.32 2.577a49.255 49.255 0 0 1 11.36 0c1.497.174 2.57 1.46 2.57 2.93V21a.75.75 0 0 1-1.085.67L12 18.089l-7.165 3.583A.75.75 0 0 1 3.75 21V5.507c0-1.47 1.073-2.756 2.57-2.93Z"
            clip-rule="evenodd"
          />
        </svg>

        <span class="text-sm font-medium text-nowrap">Salvos</span>
      </button>
    </nav>
  </body>
</html>
